name: bitacora_de_vuelos
description: Bitacora de vuelos - registro digital offline-first para UAS (drones) y aviacion tripulada.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  sqflite: ^2.4.1
  path: ^1.9.0

  geolocator: ^13.0.2

  pdf: ^3.11.1
  printing: ^5.13.4

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
