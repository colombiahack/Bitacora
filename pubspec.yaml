name: bitacora_de_vuelos
description: Bitacora de vuelos - registro digital offline-first para UAS (drones) y aviación tripulada.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestión de estado (sin generación de código: compila sin build_runner)
  flutter_riverpod: ^2.6.1

  # Base de datos local SQLite (offline-first)
  sqflite: ^2.4.1
  path: ^1.9.0

  # GPS
  geolocator: ^13.0.2

  # Exportación PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Fechas / horas / números (debe coincidir con la versión que fija tu SDK de Flutter;
  # si `flutter pub get` se queja, usa `flutter pub add intl` para que elija la correcta)
  intl: ^0.20.2

  # --- Sincronización en la nube (opcional, descomentar al activar Firestore) ---
  # firebase_core: ^3.8.0
  # cloud_firestore: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
