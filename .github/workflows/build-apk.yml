name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar carpeta android
        run: flutter create . --org com.bitacora --project-name bitacora_de_vuelos --platforms android
      - name: Permisos y nombre de la app
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n<uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Bitácora de vuelos"#' android/app/src/main/AndroidManifest.xml
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Iconos de la app
        if: ${{ hashFiles('flutter_launcher_icons.yaml') != '' && hashFiles('assets/icon/icon_fg.png') != '' }}
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-apk
          path: build/app/outputs/flutter-apk/app-release.apk
